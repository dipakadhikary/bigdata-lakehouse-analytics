# This is being added because spark was not resolving fs.defaultFS property from core-site.xml
# HDFS configuration
spark.hadoop.fs.defaultFS hdfs://localhost:9000

# Spark SQL
spark.sql.shuffle.partitions 	4

# Event logging
spark.eventLog.enabled 		false

# Hive Metastore
spark.sql.hive.metastore.version 4.0.0
spark.sql.hive.metastore.jars maven

# This is required for Kafka connectivity, this will resolve all dependencies so we dont have to put into $SPARK_HOME/jars/
spark.jars.packages org.apache.spark:spark-sql-kafka-0-10_2.13:4.0.0

